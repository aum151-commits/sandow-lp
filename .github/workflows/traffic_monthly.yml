# Месячный трафик и статус рекламы — из облака, 1-3 числа месяца. Тот же
# приём клонирования приватного репозитория, что calls.yml/yandex_requests.yml.
name: Трафик — ежемесячно

on:
  schedule:
    - cron: '0 5-13 1,2,3 * *'
  workflow_dispatch:
    inputs:
      force:
        description: "Отправить прямо сейчас, минуя проверку окна/дублей"
        type: boolean
        default: false

# Время внутри задач — московское. Раннеры GitHub живут по UTC, а все
# скрипты писались для ноутбука в Москве: «тихие часы 22:00–10:00»,
# «отчёт в 13 и 17», «дата сегодня». Без этой строки они отставали
# на три часа — уведомления о пропущенных молчали до 13:00 по Москве.
# Расписание cron ниже остаётся в UTC: GitHub считает его только так.
env:
  TZ: Europe/Moscow

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Взять код из приватного репозитория
        env:
          TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          git clone --depth 1 \
            "https://x-access-token:${TOKEN}@github.com/aum151-commits/sandow-automation.git" work

      - name: Поставить зависимости
        working-directory: work
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Отправить отчёт, если пришло время
        working-directory: work
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID_OLGA: ${{ secrets.TELEGRAM_CHAT_ID_OLGA }}
          YANDEX_METRIKA_TOKEN: ${{ secrets.YANDEX_METRIKA_TOKEN }}
          YANDEX_STORAGE_STATE: ${{ secrets.YANDEX_STORAGE_STATE }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FORCE_SEND: ${{ github.event.inputs.force == 'true' && '1' || '' }}
        run: python report_traffic_monthly.py

      - name: Вернуть отметку в приватный репозиторий
        working-directory: work
        env:
          TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          git config user.name "Sandow Bot"
          git config user.email "bot@sandowfitness.ru"
          git add state_traffic_monthly.json
          git diff --staged --quiet || (
            git commit -m "Отметка месячного трафик-отчёта" &&
            git push "https://x-access-token:${TOKEN}@github.com/aum151-commits/sandow-automation.git" HEAD:main ||
            (git pull --rebase "https://x-access-token:${TOKEN}@github.com/aum151-commits/sandow-automation.git" main &&
             git push "https://x-access-token:${TOKEN}@github.com/aum151-commits/sandow-automation.git" HEAD:main)
          )
