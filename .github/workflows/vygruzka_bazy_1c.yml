# Выгрузка базы и истории задач из 1С — ежедневно, в облаке, без ноутбука.
#
# Задача Ольги 15.10.2026: «далее каждый день например в 22:30 обновлять эту
# базу и каждый раз основываться уже на новых данных из базы — те, которые
# менеджеры записывают каждый день. и выгрузка должна быть быстрой
# автоматической, независящей от ноутбука».
#
# Как это устроено:
#   * запуск в облаке GitHub — ноутбук не участвует вообще;
#   * каждый день в 22:30 МСК (19:30 UTC) — как просила Ольга. К этому часу
#     менеджеры уже разнесли дневные записи по задачам, а рабочий день ещё
#     не закрыт наглухо;
#   * берём два последних месяца, а не всю историю: свежий месяц пополняется,
#     прошлый закрывается. Это и есть «быстро» — около трёх минут. Всю историю
#     собирает ручной запуск (нажать Run workflow, months=60);
#   * результат уходит на Яндекс.Диск клуба, в GitHub данных не остаётся;
#   * трек выгрузок (даты и количества, без единого имени) коммитится в
#     репозиторий — чтобы история запусков была видна и не терялась.
#
# Про лицензии 1С. Заход занимает живую лицензию, поэтому ночью прогон идёт
# по расписанию, а полная выгрузка запускается вручную и только когда станции
# свободны (разрешение Ольги получено 15.10.2026).
name: Выгрузка базы 1С

on:
  schedule:
    # 19:30 UTC = 22:30 МСК — ежедневное обновление базы.
    - cron: '30 19 * * *'
    # 00:05 UTC = 03:05 МСК — запасной ночной прогон, если вечерний слот
    # GitHub пропустил (расписание у них иногда опаздывает).
    - cron: '5 0 * * *'
  workflow_dispatch:
    inputs:
      # Имена только латиницей: GitHub отвечает 422 на кириллицу в выражениях.
      months:
        description: 'Сколько месяцев истории собирать (60 = вся база)'
        required: false
        default: '2'
      notes:
        description: 'Разведать заметки (1 = да, пусто = нет)'
        required: false
        default: ''

env:
  TZ: Europe/Moscow
  # Имена переменных и папок только латиницей: GitHub не принимает кириллицу
  # в выражениях рабочих процессов и отвечает 422 «failed to parse workflow».
  VYGRUZKA_DIR: ${{ github.workspace }}/vygruzka
  VYGRUZKA_LOG: ${{ github.workspace }}/vygruzka/zhurnal.log
  VYGRUZKA_SHOTS: ${{ github.workspace }}/vygruzka/snimki/

permissions:
  # Правка 11.11.2026: писать в публичный репозиторий сайта задача больше не
  # должна — каждый коммит там запускает пересборку сайта. Трек выгрузок
  # теперь уходит в приватный репозиторий по отдельному ключу.
  contents: read

jobs:
  vygruzka:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      # persist-credentials: false — иначе checkout оставляет ключ от этого
      # репозитория, и клонирование приватного репозитория для трека получает
      # отказ (та же ловушка, что поймали в стороже задач 12.11.2026).
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Подготовить папки
        run: mkdir -p vygruzka/snimki

      - name: Поставить браузер
        run: npm i playwright && npx playwright install --with-deps chromium

      - name: Выгрузить базу и историю задач
        env:
          # Учётка МОСКОВСКОЙ 1С. Богородицкие FITNESS_1C_* здесь не годятся:
          # клубы не смешиваем (§0б), у них разные учётные записи.
          ONEC_LOGIN: ${{ secrets.ONEC_MOSCOW_LOGIN }}
          ONEC_PASSWORD: ${{ secrets.ONEC_MOSCOW_PASSWORD }}
        run: |
          # Имена переменных только латиницей: bash не принимает кириллицу в
          # именах и падает с «МЕСЯЦЕВ=2: command not found» — на этом упал
          # первый облачный прогон 15.10.2026.
          MONTHS="${{ github.event.inputs.months || '2' }}"
          FLAG=""
          if [ -z "${{ github.event.inputs.notes }}" ]; then FLAG="--без-заметок"; fi
          echo "собираем месяцев: $MONTHS, флаг: ${FLAG:-нет}"
          node scripts/1c/ночная-выгрузка.js "$MONTHS" $FLAG

      - name: Короткая сводка в лог прогона
        # Только месяцы и количества. Ничего личного сюда попадать не должно:
        # лог прогона публичного репозитория читается кем угодно.
        if: always()
        run: |
          echo "=== сводка ==="
          cat vygruzka/svodka-*.txt 2>/dev/null || echo "сводки нет"
          echo "=== хвост журнала ==="
          tail -n 30 vygruzka/zhurnal.log 2>/dev/null || echo "журнала нет"

      - name: Отдать выгрузку в хранилище клуба
        # Данные уходят в российское хранилище клуба, минуя GitHub.
        # 03.11.2026: на новом Диске клуба (корпоративная почта) бесплатный
        # тариф, а ВебДАВ на нём закрыт — «402 Payment Required». Выгрузка из
        # 1С при этом собирается успешно и терялась целиком. Теперь: сначала
        # Диск, а если он отказал — российское S3-хранилище клуба.
        if: always()
        env:
          YADISK_LOGIN: ${{ secrets.YADISK_LOGIN }}
          YADISK_APP_PASSWORD: ${{ secrets.YADISK_APP_PASSWORD }}
          YC_S3_KEY_ID: ${{ secrets.YC_S3_KEY_ID }}
          YC_S3_SECRET: ${{ secrets.YC_S3_SECRET }}
          S3_BUCKET: sandow-lead-data
        run: |
          python3 -m pip install --quiet boto3
          python3 scripts/1c/otdat-v-hranilishche.py vygruzka

      - name: Записать трек выгрузок в приватный репозиторий
        # Трек — это журнал запусков: когда, что, сколько. Ни одного имени
        # и ни одного телефона, поэтому хранить его можно и нужно — так
        # история выгрузок видна и её не потерять вместе с ноутбуком.
        #
        # Правка 11.11.2026: раньше трек коммитился в публичный репозиторий
        # сайта, и каждый такой коммит запускал пересборку сайта. Вместе с
        # другими задачами это забивало лимит GitHub: пересборки валились
        # пачками и переставали запускаться задачи по заявкам. Теперь трек
        # живёт в приватном репозитории state.
        if: always()
        env:
          TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          STATE_REPO: aum151-commits/sandow-automation.git
        run: |
          if [ ! -f vygruzka/трек-выгрузок.md ]; then
            echo "файла трека нет — пропускаю"
            exit 0
          fi
          git clone --depth 1 "https://x-access-token:${TOKEN}@${STATE_REPO}" отметки 2>/dev/null || true
          mkdir -p отметки/трек
          # В приватный репозиторий кладём и то, что успело накопиться раньше
          # в публичном: история выгрузок не должна обрываться на переезде.
          if [ -f трек/выгрузки-1С.md ]; then
            cp трек/выгрузки-1С.md отметки/трек/выгрузки-1С.md
          fi
          if [ -f трек/выгрузки-1С.jsonl ]; then
            cp трек/выгрузки-1С.jsonl отметки/трек/выгрузки-1С.jsonl
          fi
          cp vygruzka/трек-выгрузок.md отметки/трек/выгрузки-1С.md
          cp vygruzka/трек.jsonl отметки/трек/выгрузки-1С.jsonl 2>/dev/null || true
          cd отметки
          git config user.name "sandow-bot"
          git config user.email "bot@sandowfitness.ru"
          git add трек/
          if git diff --staged --quiet; then
            echo "трек не изменился"
            exit 0
          fi
          git commit -m "трек выгрузок 1С: $(date -u +%Y-%m-%dT%H:%M)"
          for attempt in 1 2 3; do
            git pull --rebase origin main || true
            if git push "https://x-access-token:${TOKEN}@${STATE_REPO}" HEAD:main; then
              echo "трек отправлен"
              exit 0
            fi
            echo "попытка ${attempt} не удалась, ждём и повторяем"
            sleep 5
          done
          echo "трек не записался"; exit 1

      - name: Упасть, если выгрузки не было
        # Молчаливый пропуск хуже падения: о падении GitHub напишет сам.
        run: |
          ls vygruzka/Клиенты-*.xlsx >/dev/null 2>&1 || {
            echo "Файла клиентов нет — выгрузка не прошла"; exit 1; }
