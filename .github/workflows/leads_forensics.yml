# Разовая разведка: сколько заявок с сайта РЕАЛЬНО доходило по дням.
#
# Зачем. 11–12.11.2026 Ольга заметила: Метрика показывает 7–11 «заявок с сайта»
# в день, а менеджеры говорят про тишину. Нужно понять, где расходятся цифры:
#   * Метрика считает нажатия кнопки отправки (в том числе с ошибкой в номере);
#   * поэтому надо посмотреть, сколько заявок реально записано у бота.
#
# Где смотрим: российское хранилище (то же, куда пишет бот). Файлы:
#   data/site_leads_by_day.json  — счётчик заявок по дням;
#   data/lead_response_log.json  — журнал заявок и ответов по ним.
#
# ВАЖНО: репозиторий публичный, журнал прогона читается кем угодно. Поэтому
# сюда печатаются ТОЛЬКО даты и количества. Ни телефонов, ни имён, ни текстов
# заявок. Это же правило действует для любой будущей разведки.
#
# Запускается только вручную: вкладка Actions → «Разведка заявок» → Run workflow.
name: Разведка заявок

on:
  workflow_dispatch:

env:
  TZ: Europe/Moscow

jobs:
  look:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install boto3

      - name: Посчитать заявки по дням
        env:
          S3_KEY_ID: ${{ secrets.YC_S3_KEY_ID }}
          S3_SECRET: ${{ secrets.YC_S3_SECRET }}
          S3_BUCKET: sandow-lead-data
        run: python scripts/отметки/разведка-заявок.py

      # Проверка живого канала. 12.11.2026 форма на статьях жмёт кнопку
      # «Отправляем…» и НИЧЕГО не отправляет: браузер получает отказ на
      # запрос к приёмнику на домене pages.dev. Отсюда два вопроса, и оба
      # проверяются здесь, из облака (там нет российских блокировок):
      #   * живой ли приёмник вообще;
      #   * принимает ли он заявку и что отвечает.
      # Номер проверочный (000…), поэтому такая заявка уходит только куратору
      # в личку и не попадает ни в 1С, ни в рабочий чат.
      - name: Проверить приёмник заявок
        run: |
          python - <<'PY'
          import json, socket, urllib.error, urllib.request

          print("=== приёмник на pages.dev ===")
          try:
              print("  имя разворачивается в:", socket.gethostbyname("sandow-emergency-leads.pages.dev"))
          except Exception as ошибка:
              print("  имя НЕ разворачивается:", type(ошибка).__name__)

          адрес = "https://sandow-emergency-leads.pages.dev/site-lead"
          тело = json.dumps({"phone": "0000000001", "name": "проверка",
                             "test": True, "source": "статья-проверка"}).encode()
          запрос = urllib.request.Request(адрес, data=тело, method="POST")
          запрос.add_header("Content-Type", "application/json")
          запрос.add_header("Origin", "https://lp.sandowfitness.ru")
          try:
              with urllib.request.urlopen(запрос, timeout=45) as ответ:
                  print("  ответ:", ответ.status, ответ.read()[:200].decode("utf-8", "replace"))
                  print("  CORS:", ответ.headers.get("Access-Control-Allow-Origin"))
          except urllib.error.HTTPError as ошибка:
              print("  ответ:", ошибка.code, ошибка.read()[:200].decode("utf-8", "replace"))
              print("  CORS:", ошибка.headers.get("Access-Control-Allow-Origin"))
          except Exception as ошибка:
              print("  запрос не прошёл:", type(ошибка).__name__, str(ошибка)[:120])

          print("\n=== бот на onrender.com ===")
          for путь in ("/health", "/"):
              try:
                  with urllib.request.urlopen("https://sandow-lead-bot-standalone.onrender.com" + путь, timeout=60) as ответ:
                      print(f"  {путь}: {ответ.status} {ответ.read()[:160].decode('utf-8', 'replace')}")
              except Exception as ошибка:
                  print(f"  {путь}: не ответил — {type(ошибка).__name__} {str(ошибка)[:100]}")

          # Может ли форма со статьи отправлять заявку ПРЯМО боту, минуя
          # pages.dev: важны и приём заявки, и разрешение для браузера (CORS).
          # Без разрешения браузер отменит отправку ещё до того, как она уйдёт.
          print("\n=== заявка прямо боту (с проверочным номером) ===")
          бот = "https://sandow-lead-bot-standalone.onrender.com/site-lead"
          for способ in ("OPTIONS", "POST"):
              запрос = urllib.request.Request(бот, data=(тело if способ == "POST" else None), method=способ)
              запрос.add_header("Origin", "https://lp.sandowfitness.ru")
              запрос.add_header("Content-Type", "application/json")
              if способ == "OPTIONS":
                  запрос.add_header("Access-Control-Request-Method", "POST")
                  запрос.add_header("Access-Control-Request-Headers", "content-type")
              try:
                  with urllib.request.urlopen(запрос, timeout=60) as ответ:
                      print(f"  {способ}: {ответ.status} | разрешение для браузера: "
                            f"{ответ.headers.get('Access-Control-Allow-Origin')}")
                      if способ == "POST":
                          print("    тело:", ответ.read()[:200].decode("utf-8", "replace"))
              except urllib.error.HTTPError as ошибка:
                  print(f"  {способ}: {ошибка.code} | разрешение для браузера: "
                        f"{ошибка.headers.get('Access-Control-Allow-Origin')}")
                  print("    тело:", ошибка.read()[:200].decode("utf-8", "replace"))
              except Exception as ошибка:
                  print(f"  {способ}: не прошёл — {type(ошибка).__name__} {str(ошибка)[:120]}")
          PY
