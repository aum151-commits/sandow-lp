# Сторож лид-бота «Сандов Фитнес» + запасной приём заявок.
#
# Зачем: заявки от клиентов приходят через @sandowclub_bot на бесплатный
# Render. Будильник рядом (keepalive.yml) не даёт сервису уснуть, но если
# бот всё-таки замолчал — потерянный вебхук, упавший сервис — этого никто
# не замечал: заявки просто переставали доходить, молча.
#
# Что делает каждые 15 минут:
#   1) проверяет /health лид-бота (три попытки — холодный старт не считается сбоем);
#   2) если сервис жив — сверяет адрес вебхука и при расхождении ставит заново САМ;
#   3) если сервис лежит — включает ЗАПАСНОЙ ПРИЁМ: снимает вебхук, сам забирает
#      сообщения клиентов, отвечает им, что заявка принята, и пересылает её
#      Ольге в личку. Поток не теряется, пока Render не поднимется.
#
# Важно: вебхук чиним только когда сервис жив. Иначе сторож и запасной приём
# перетягивали бы вебхук друг у друга каждые 15 минут.
#
# Живёт в публичном репозитории намеренно: здесь минуты Actions бесплатны,
# поэтому сторож не зависит ни от ноутбука, ни от лимита приватного репо.
# Секреты GitHub в логи не попадают и в форки не передаются; сам сторож
# печатает только «ок» или «тревога», никаких данных клиентов.

name: ВРЕМЕННО — проверка запасного приёма

on:
  workflow_dispatch:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Проверить бота, починить вебхук, при падении принять заявки самому
        env:
          BOT: ${{ secrets.CLIENT_BOT_TOKEN }}
          HOOK_SECRET: ${{ secrets.HOOK_SECRET }}
          ALERT_BOT: ${{ secrets.ALERT_BOT_TOKEN }}
          ALERT_CHAT: ${{ secrets.ALERT_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.parse, urllib.request

          BOT = os.environ["BOT"]
          SECRET = os.environ["HOOK_SECRET"]
          ALERT_BOT = os.environ["ALERT_BOT"]
          ALERT_CHAT = os.environ["ALERT_CHAT"]

          SERVICE = "https://sandow-lead-bot-заведомо-нет-такого.onrender.com"
          EXPECTED = f"https://sandow-lead-bot.onrender.com/tg/{SECRET}"

          def get(url, timeout=95):
              with urllib.request.urlopen(url, timeout=timeout) as r:
                  return r.status, r.read().decode("utf-8", "replace")

          def api(method, **params):
              url = f"https://api.telegram.org/bot{BOT}/{method}"
              if params:
                  url += "?" + urllib.parse.urlencode(params)
              return json.loads(get(url, 60)[1])

          def send(chat, text, token=None):
              data = urllib.parse.urlencode({"chat_id": chat, "text": text}).encode()
              urllib.request.urlopen(
                  f"https://api.telegram.org/bot{token or ALERT_BOT}/sendMessage",
                  data=data, timeout=60,
              )

          def alert(text):
              # раз в час максимум: при долгом падении не звоним каждые 15 минут
              if time.gmtime().tm_min >= 15:
                  print("тревога подавлена (уже сообщали в этом часу)")
                  return
              send(ALERT_CHAT, text)
              print("тревога отправлена")

          # --- 1. жив ли сервис. Холодный старт занимает до минуты, поэтому три попытки
          alive = False
          for попытка in range(3):
              try:
                  code, _ = get(f"{SERVICE}/health")
                  if code == 200:
                      alive = True
                      print(f"сервис отвечает (попытка {попытка + 1})")
                      break
                  print(f"попытка {попытка + 1}: код {code}")
              except Exception as e:
                  print(f"попытка {попытка + 1}: {type(e).__name__}")
              time.sleep(20)

          # --- 2. сервис жив: следим за вебхуком
          if alive:
              try:
                  info = api("getWebhookInfo").get("result", {})
              except Exception as e:
                  print("не удалось спросить Telegram:", type(e).__name__)
                  raise SystemExit(0)

              url = info.get("url") or ""
              pending = info.get("pending_update_count", 0)
              print("адрес вебхука совпадает:", url == EXPECTED)
              print("необработанных сообщений:", pending)
              if info.get("last_error_message"):
                  print("последняя ошибка Telegram:", info["last_error_message"])

              if url != EXPECTED:
                  r = api("setWebhook", url=EXPECTED)
                  if r.get("ok"):
                      send(ALERT_CHAT,
                           "Вебхук лид-бота слетел — я вернул его на место.\n"
                           "Заявки снова доходят. Так бывает после обновления бота.")
                      print("вебхук восстановлен")
                  else:
                      alert("Вебхук лид-бота слетел, и вернуть его не вышло:\n"
                            f"{r.get('description')}\nЗаявки сейчас НЕ доходят.")
              elif pending > 20:
                  alert(f"У лид-бота скопилось {pending} необработанных сообщений.\n"
                        "Похоже, он получает заявки, но не отвечает.")
              raise SystemExit(0)

          # --- 3. сервис лежит: принимаем заявки сами
          print("сервис не отвечает — включаю запасной приём")
          alert("Лид-бот не отвечает.\n"
                "Включила запасной приём: клиентам отвечаю сама, их обращения "
                "буду присылать вам сюда — передайте менеджерам. Кнопки и подарок "
                "сейчас недоступны, Render надо поднять: dashboard.render.com.")

          # снимаем вебхук, иначе Telegram не отдаст сообщения через getUpdates
          api("deleteWebhook")

          ОТВЕТ = ("Спасибо, ваше сообщение получено! Мы свяжемся с вами в "
                   "ближайшее время.\n\nЕсли удобнее сейчас — позвоните: "
                   "+7 (495) 795-69-57.")

          принято = 0
          offset = None
          дедлайн = time.time() + 60   # дежурим девять минут, до следующего запуска

          while time.time() < дедлайн:
              params = {"timeout": 25}
              if offset:
                  params["offset"] = offset
              try:
                  upd = api("getUpdates", **params)
              except Exception as e:
                  print("getUpdates:", type(e).__name__)
                  time.sleep(5)
                  continue

              for item in upd.get("result", []):
                  offset = item["update_id"] + 1
                  msg = item.get("message") or item.get("callback_query", {}).get("message")
                  if not msg:
                      continue
                  chat = msg.get("chat", {})
                  текст = msg.get("text") or msg.get("contact", {}).get("phone_number") or "(без текста)"
                  кто = " ".join(filter(None, [chat.get("first_name"), chat.get("last_name")])) or "клиент"
                  ник = f"@{chat['username']}" if chat.get("username") else f"id {chat.get('id')}"

                  try:
                      send(chat.get("id"), ОТВЕТ, token=BOT)
                  except Exception as e:
                      print("не ответить клиенту:", type(e).__name__)

                  # шлём только в личку: ошибиться рабочим чатом дороже,
                  # чем передать заявку через Ольгу
                  карточка = (f"ЗАЯВКА (запасной приём, бот лежит)\n"
                              f"{кто}, {ник}\n\n{текст}")
                  send(ALERT_CHAT, карточка)
                  принято += 1

          print(f"запасной приём отработал, сообщений принято: {принято}")

          # возвращаем вебхук: если сервис уже поднялся, он сразу продолжит сам
          r = api("setWebhook", url=EXPECTED)
          print("вебхук возвращён:", r.get("ok"))
          if принято:
              send(ALERT_CHAT, f"Запасной приём: обработано обращений — {принято}. "
                               "Все карточки выше — передайте менеджерам.")
          PY
