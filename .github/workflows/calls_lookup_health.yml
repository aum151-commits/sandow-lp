# Утренняя проверка справочника звонков — за час до открытия отдела продаж.
#
# Зачем. Отдел начинает работу в 10:00. Если ночная выгрузка из 1С не
# прошла, сторож подписывает пропущенные вчерашними данными, и узнаётся об
# этом тогда, когда менеджеры уже звонят. Требование Ольги 12.10.2026:
# «а можно сразу узнать, что выгрузка не удалась и исправить это до начала
# работы в 10:00 отдела продаж?»
#
# Два запуска нарочно: расписание GitHub иногда опаздывает или пропускает
# слот. Если первый прогон всё починил — второй промолчит (проверка
# отправляет сообщение только когда есть проблема).
#
# Задача живёт в публичном репозитории по той же причине, что и сторож:
# минуты Actions в публичном репозитории бесплатны без лимита, а приватный
# однажды уже исчерпал их и 5,5 суток молча не работал (25–31.08.2026).
name: Справочник звонков — утренняя проверка

on:
  schedule:
    - cron: '50 5 * * *'    # 08:50 МСК
    - cron: '20 6 * * *'    # 09:20 МСК — второй заход
  workflow_dispatch:
    inputs:
      report:
        description: 'Прислать строку «всё в порядке» даже если всё хорошо'
        type: boolean
        default: true

env:
  TZ: Europe/Moscow

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Проверить выгрузку, справочник и функцию
        # Зависимостей нет нарочно: проверка не должна падать из-за
        # недоступного pip — её задача сообщать о чужих сбоях.
        #
        # Чат не передаём: скрипт шлёт в личный чат Ольги, как и предпросмотр
        # сторожа. Правило §0г — проверки идут только куратору в личку,
        # в рабочие группы им нельзя.
        env:
          LOOKUP_URL: ${{ secrets.LOOKUP_URL }}
          LOOKUP_TOKEN: ${{ secrets.LOOKUP_TOKEN }}
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN_MARKETING }}
          CHECK_REPORT: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: python check_lookup_health.py
