# Разовая задача: отправить письмо в поддержку Тильды (X-Frame-Options).
# Причина запуска из облака: SMTP-порты Яндекса с ноутбука закрыты (ВПН),
# а раннеры GitHub шлют без ограничений. Задача Ольги 13.09: «письмо сам отправь».
name: Письмо Тильде про вебвизор

on:
  workflow_dispatch: {}

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Отправить письмо
        env:
          LOGIN: ${{ secrets.MAIL_SANDOW_LOGIN }}
          PASSWORD: ${{ secrets.MAIL_SANDOW_APP_PASSWORD }}
        shell: python
        run: |
          import os, smtplib
          from email.mime.text import MIMEText
          from email.header import Header
          import base64
          тело = base64.b64decode("").decode("utf-8")
          msg = MIMEText(тело, "plain", "utf-8")
          msg["Subject"] = Header('X-Frame-Options мешает Вебвизору Метрики — просим отключить для sandowfitness.ru', "utf-8")
          msg["From"] = os.environ["LOGIN"]
          msg["To"] = "help@tilda.cc"
          s = smtplib.SMTP_SSL("smtp.yandex.ru", 465, timeout=60)
          s.login(os.environ["LOGIN"], os.environ["PASSWORD"])
          s.sendmail(os.environ["LOGIN"], ["help@tilda.cc"], msg.as_string())
          s.quit()
          print("отправлено")
