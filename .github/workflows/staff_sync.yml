# Еженедельная сверка состава: менеджеры и тренеры.
#
# Зачем: по фамилиям из чата считается, кто продал и после чьей консультации
# купили. Уволился человек или пришёл новый — его отметки тихо уходят в графу
# «не указан» и портят статистику, а заметить это трудно.
#
# Работает в облаке, поэтому не зависит ни от ноутбука, ни от Claude.
# Источник по менеджерам — 1С (там к каждому привязан телефон телефонии),
# по тренерам — сайт клуба. Пока нет ключа внешнего приложения к 1С, шаг
# по менеджерам честно пропускается, а не делает вид, что сверил.
name: Сверка состава отдела

on:
  schedule:
    - cron: '40 6 * * 1'    # понедельник, около 9:40 по Москве
  workflow_dispatch:

# Время внутри задач — московское. Раннеры GitHub живут по UTC, а все
# скрипты писались для ноутбука в Москве: «тихие часы 22:00–10:00»,
# «отчёт в 13 и 17», «дата сегодня». Без этой строки они отставали
# на три часа — уведомления о пропущенных молчали до 13:00 по Москве.
# Расписание cron ниже остаётся в UTC: GitHub считает его только так.
env:
  TZ: Europe/Moscow

jobs:
  staff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Взять текущий список из приватного репозитория
        env:
          TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          git clone --depth 1 \
            "https://x-access-token:${TOKEN}@github.com/aum151-commits/sandow-automation.git" work

      - name: Сверить состав
        working-directory: work
        env:
          ALERT_BOT_TOKEN: ${{ secrets.ALERT_BOT_TOKEN }}
          ALERT_CHAT_ID: ${{ secrets.ALERT_CHAT_ID }}
          FITNESS_1C_LOGIN: ${{ secrets.FITNESS_1C_LOGIN }}
          FITNESS_1C_PASSWORD: ${{ secrets.FITNESS_1C_PASSWORD }}
          FITNESS_1C_APIKEY: ${{ secrets.FITNESS_1C_APIKEY }}
        run: |
          # имя переменной только латиницей: bash кириллицу за имя не считает
          export TODAY=$(date +%Y-%m-%d)
          python sync_staff.py

      - name: Сохранить обновлённый список
        working-directory: work
        env:
          TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          git config user.name "Sandow Bot"
          git config user.email "bot@sandowfitness.ru"
          git add data/staff/staff.json
          git diff --staged --quiet || (
            git commit -m "Сверка состава: список обновлён" &&
            # Задачи идут одновременно и пишут состояние в один репозиторий.
            # Кто пришёл вторым, получал отказ «fetch first» и терял свою
            # запись — тогда следующий запуск слал те же уведомления заново.
            git push "https://x-access-token:${TOKEN}@github.com/aum151-commits/sandow-automation.git" HEAD:main || (
              git pull --rebase "https://x-access-token:${TOKEN}@github.com/aum151-commits/sandow-automation.git" main &&
              git push "https://x-access-token:${TOKEN}@github.com/aum151-commits/sandow-automation.git" HEAD:main
            )
          )
