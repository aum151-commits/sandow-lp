# Сторож облачных задач: замечает, что задача перестала работать.
#
# Повод: с 25.08.2026 задачи в приватном репозитории не запускались вовсе —
# кончились бесплатные минуты GitHub. Пять суток не собирались заявки с
# карточки Яндекса, и об этом не пришло ни одного сообщения.
#
# Живёт в публичном репозитории, поэтому не зависит ни от ноутбука, ни от
# лимита минут — здесь они бесплатны.
#
# ВАЖНО (правка 11.11.2026). Раньше отметка «о чём уже сообщили» коммитилась
# в ЭТОТ репозиторий — тот же, из которого GitHub собирает сайт lp.sandowfitness.ru.
# Каждый коммит запускал пересборку сайта, за час их набиралось столько, что
# GitHub упирался в лимит: пересборки валились пачками, очередь забивалась, и
# вместе с ними перестали запускаться задачи по заявкам («стартовый сбой»).
# Теперь отметка живёт в приватном репозитории state, а сайт — только сайт.
name: Сторож облачных задач

on:
  schedule:
    - cron: '25 */3 * * *'
  workflow_dispatch:

# Время внутри задач — московское. Раннеры GitHub живут по UTC, а все
# скрипты писались для ноутбука в Москве: «тихие часы 22:00–10:00»,
# «отчёт в 13 и 17», «дата сегодня». Без этой строки они отставали
# на три часа — уведомления о пропущенных молчали до 13:00 по Москве.
# Расписание cron ниже остаётся в UTC: GitHub считает его только так.
env:
  TZ: Europe/Moscow
  # Репозиторий, где лежат отметки задач, — в виде «владелец/имя», без «.git»:
  # помощник обращается к нему запросом к GitHub, и лишний хвост ломает адрес
  # (на этом упал прогон 12.11.2026: GitHub отвечал «файла нет»).
  STATE_REPO: aum151-commits/sandow-automation

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      # persist-credentials: false обязателен. Иначе checkout оставляет в
      # окружении ключ от ЭТОГО репозитория, и следующий `git clone` приватного
      # репозитория по своему ключу получает отказ — именно на этом первый
      # прогон после переезда упал 12.11.2026 («cp: cannot create ... No such
      # file or directory»: папка не создалась, потому что клонирование молча
      # не прошло).
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests

      - name: Взять отметку из приватного репозитория
        # Если в приватном репозитории отметки ещё нет, остаётся та, что лежит
        # рядом в рабочей папке: первый прогон после переезда не должен
        # заново рассылать тревоги, о которых уже сообщали.
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: python scripts/отметки/хранилище-отметок.py взять state_cloud_guard.json

      - name: Проверить облачные задачи
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ALERT_BOT_TOKEN: ${{ secrets.ALERT_BOT_TOKEN }}
          ALERT_CHAT_ID: ${{ secrets.ALERT_CHAT_ID }}
        run: python guard_cloud_tasks.py

      - name: Запомнить, о чём уже сообщили
        # Пишем в приватный репозиторий обычным запросом к GitHub: коммит в
        # публичный запускал бы пересборку сайта и съедал лимит GitHub, а
        # `git push` конфликтовал бы с ключом самого сайта.
        if: always()
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          python scripts/отметки/хранилище-отметок.py положить \
            state_cloud_guard.json "Сторож задач: отметка отправленных тревог"
