# Новые отзывы, рейтинг и снятые по жалобе — в личный телеграм Ольге и
# управляющему. Раньше это жило на ноутбуке и молчало с 31 августа:
# код в облако перенесли, а задачу для него не завели.
#
# Источники независимы: если сессия 2ГИС протухла, отзывы Яндекса всё
# равно доходят. Раньше падение 2ГИС роняло весь скрипт целиком.
name: Отзывы — новые, рейтинг, снятые

on:
  schedule:
    - cron: '5 6-19 * * *'   # каждый час с 9:05 до 22:05 МСК
  workflow_dispatch:

env:
  TZ: Europe/Moscow

jobs:
  reviews:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Взять код
        env:
          TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          git clone --depth 1             "https://x-access-token:${TOKEN}@github.com/aum151-commits/sandow-automation.git" work

      - name: Поставить зависимости
        working-directory: work/rpa
        run: |
          pip install requests playwright python-dotenv
          playwright install --with-deps chromium

      # НАСТОЯЩАЯ ПРИЧИНА МОЛЧАНИЯ 2ГИС С 1 ОКТЯБРЯ (найдена 12.10.2026).
      # У соседних задач (cabinet_tasks.yml, more_tasks.yml) есть шаг
      # «Разложить сессии кабинетов»: он кладёт сессии из секретов файлами
      # в data/. У задачи отзывов такого шага НЕ БЫЛО, а gis_open.py и
      # fetch_yandex_recent читают сессию ИМЕННО ФАЙЛОМ. То есть задача
      # открывала кабинет по тому снимку, который случайно лежал в
      # репозитории (последний — от 15.09.2026), получала форму входа и
      # писала «кабинет не открылся: проверьте сессию и ВПН». Диагноз
      # «2ГИС не пускает зарубежные адреса раннеров» оказался неверным:
      # 12.10 в 19:01 МСК соседняя задача положила свежую сессию в
      # репозиторий, и отзывы 2ГИС тут же прочитались С ТОГО ЖЕ раннера.
      # Теперь задача сама себя обеспечивает сессиями.
      - name: Разложить сессии кабинетов
        working-directory: work/rpa
        env:
          YANDEX_STORAGE_STATE: ${{ secrets.YANDEX_STORAGE_STATE }}
          GIS_STORAGE_STATE: ${{ secrets.GIS_STORAGE_STATE }}
        run: |
          mkdir -p data
          python - <<'PY'
          import base64, os, pathlib
          пары = {
              "YANDEX_STORAGE_STATE": "data/storage_state.json",
              "GIS_STORAGE_STATE": "data/2gis_storage_state.json",
          }
          for ключ, файл in пары.items():
              значение = os.environ.get(ключ, "").strip()
              if not значение:
                  print(f"{файл}: секрета нет")
                  continue
              данные = base64.b64decode(значение)
              if not данные.lstrip().startswith(b"{"):
                  данные = значение.encode("utf-8")
              pathlib.Path(файл).write_bytes(данные)
              print(f"{файл}: разложено, {len(данные)} байт")
          PY

      - name: Проверить отзывы
        working-directory: work/rpa
        env:
          # Бот маркетинга: именно с ним управляющий начинал диалог.
          # С прежним ботом Telegram отдавал 400 — он не может писать
          # человеку, который ему ни разу не написал.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN_MARKETING }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Токен 2ГИС-API. Кабинет 2ГИС не пускает зарубежные адреса
          # GitHub-раннеров, поэтому отзывы 2ГИС читаются напрямую по
          # токену — без браузера. Секрет снят на ноутбуке 12.10.2026.
          # Если секрета нет, скрипт идёт прежним путём, через кабинет.
          GIS_API_TOKEN: ${{ secrets.GIS_API_TOKEN }}
        run: python -m src.rpa.watch_new_reviews

      - name: Вернуть состояние
        working-directory: work
        if: always()
        env:
          TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          git config user.name "Sandow Bot"
          git config user.email "bot@sandowfitness.ru"
          git add -A rpa/data 2>/dev/null || true
          git diff --staged --quiet || (
            git commit -m "Отзывы: обновлено состояние" &&
            git push "https://x-access-token:${TOKEN}@github.com/aum151-commits/sandow-automation.git" HEAD:main || (
              git pull --rebase "https://x-access-token:${TOKEN}@github.com/aum151-commits/sandow-automation.git" main &&
              git push "https://x-access-token:${TOKEN}@github.com/aum151-commits/sandow-automation.git" HEAD:main
            )
          )
