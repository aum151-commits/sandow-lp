# Заявки Богородицка → 1С. Живёт в публичном репозитории (минуты Actions
# бесплатны без лимита — приватный репозиторий однажды уже исчерпал их и
# 5,5 суток молча не работал, 25-31.08.2026, см. cloud_guard/keepalive).
#
# Очередь заявок (data/intake/bogoroditsk_1c_queue.jsonl) пишут функции
# Cloudflare tg-bog.js/lead.js в приватный репозиторий sandow-automation;
# этот workflow читает и пишет её обратно по токену PRIVATE_REPO_TOKEN —
# код (этот файл) в публичном репозитории, данные (телефоны) в приватном.
#
# Запуск — sandow-cron-worker (Cloudflare Cron Trigger, раз в 30 минут),
# не встроенный cron GitHub Actions (он ненадёжен под нагрузкой у клуба —
# см. другие workflow). workflow_dispatch оставлен и для ручного запуска.
name: Заявки Богородицка в 1С

on:
  workflow_dispatch:
    inputs:
      # Правка 08.10.2026. Робот ходит в 1С под учёткой управляющей, а 1С держит
      # одну активную сессию на пользователя: пока она работает, сеансы выбивают
      # друг друга (прогон 37765646115 — шесть потерь сеанса и ноль заявок).
      # Поэтому по умолчанию робот работает только в тихие часы (22:00–08:00 МСК),
      # а этот флаг нужен для ручного запуска, когда заявки надо завести сразу.
      now:
        description: 'Заводить заявки сейчас, не глядя на тихие часы'
        type: boolean
        default: false

concurrency:
  group: bogoroditsk-1c-leads
  cancel-in-progress: false

env:
  TZ: Europe/Moscow

jobs:
  consume:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: bogoroditsk-1c-consumer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Поставить зависимости
        run: |
          npm install
          npx --yes playwright install --with-deps chromium

      - name: Разгрузить очередь в 1С
        env:
          FITNESS_1C_LOGIN: ${{ secrets.FITNESS_1C_LOGIN }}
          FITNESS_1C_PASSWORD: ${{ secrets.FITNESS_1C_PASSWORD }}
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          BOG_1C_NOW: ${{ inputs.now && '1' || '' }}
        run: node bog_lead_consumer.js

      # Правка 08.10.2026: раньше забирались только error-*.png. Диагностика
      # сбоя 10:15/10:23 (UTC) упёрлась именно в это: текстовые слепки экрана
      # (error-*.txt) и снимок входа (posle-vhoda.png) оставались на раннере и
      # исчезали вместе с ним, а по пустым PNG нельзя понять, что показал 1С.
      - name: Снимки экрана и слепки при ошибках
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: error-screenshots
          path: |
            bogoroditsk-1c-consumer/error-*.png
            bogoroditsk-1c-consumer/error-*.txt
            bogoroditsk-1c-consumer/posle-vhoda.png
          if-no-files-found: ignore
          retention-days: 14
