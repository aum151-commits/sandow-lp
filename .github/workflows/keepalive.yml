# Будит лид-бота на Render, чтобы клиент не ждал холодного старта.
# Живёт в публичном репозитории: минуты GitHub Actions здесь не расходуются.
#
# ВАЖНО, измерено 31.08.2026: расписание GitHub на деле опаздывает на часы —
# «каждые 10 минут» приходило раз в 4 часа. Поэтому этот будильник считается
# запасным, а основные — задача на компьютере Ольги и внешний сервис проверок.
#
# Будим только лид-бота: бесплатные часы Render считаются на весь аккаунт,
# и держать бодрыми ещё вики с тренажёром — значит проесть лимит на том,
# что не приносит заявок.
name: Будильник сервисов

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

# Время внутри задач — московское. Раннеры GitHub живут по UTC, а все
# скрипты писались для ноутбука в Москве: «тихие часы 22:00–10:00»,
# «отчёт в 13 и 17», «дата сегодня». Без этой строки они отставали
# на три часа — уведомления о пропущенных молчали до 13:00 по Москве.
# Расписание cron ниже остаётся в UTC: GitHub считает его только так.
env:
  TZ: Europe/Moscow

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Разбудить лид-бота
        run: |
          url=https://sandow-lead-bot.onrender.com/health
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 "$url" || echo timeout)
          echo "$url -> $code"

      # Запасной завод для будильника задач. Обычно он крутит себя сам:
      # раз в несколько минут ходит запросом на собственный адрес, поэтому
      # Render его не усыпляет. Но если цикл оборвётся (перезапуск платформы,
      # сбой сети), разбудить его будет некому — вот этот шаг и разбудит.
      # Сюда же приходит и точность: как только сервис ожил, расписание
      # снова идёт по московскому времени, а не «когда GitHub соберётся».
      - name: Разбудить будильник задач
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "секрет не задан — пропускаю"; exit 0; fi
          url="https://sandow-cron.onrender.com/cron/$CRON_SECRET"
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 "$url" || echo timeout)
          echo "будильник задач -> $code"
