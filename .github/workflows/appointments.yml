# Назначенные встречи из звонков — считается в облаке.
#
# Последнее звено воронки, которое держало ноутбук: записи качались туда,
# там расшифровывались и разбирались. При выключенном ноутбуке конверсия
# «звонок → встреча назначена» просто не появлялась.
#
# Живёт в публичном репозитории: в приватном кончились бесплатные минуты.
# Код и журнал — в приватном, сюда клонируются по токену. В публичный лог
# печатаются только количества, телефоны и цитаты — никогда.
#
# Каждый час, потому что расписание GitHub опаздывает на часы: за прогон
# берётся не больше 25 звонков, остаток догоняется следующим запуском.
# Уже разобранные помнит processed_calls.json, повторно не платим.
name: Встречи из звонков

on:
  schedule:
    - cron: '25 * * * *'
  workflow_dispatch:

# Время внутри задач — московское. Раннеры GitHub живут по UTC, а все
# скрипты писались для ноутбука в Москве: «тихие часы 22:00–10:00»,
# «отчёт в 13 и 17», «дата сегодня». Без этой строки они отставали
# на три часа — уведомления о пропущенных молчали до 13:00 по Москве.
# Расписание cron ниже остаётся в UTC: GitHub считает его только так.
env:
  TZ: Europe/Moscow

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Взять код и журнал из приватного репозитория
        env:
          TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          git clone --depth 1 \
            "https://x-access-token:${TOKEN}@github.com/aum151-commits/sandow-automation.git" work

      - run: pip install requests

      # 15.10.2026. Основной дверью журнала стала служба кабинета
      # (cdrStatisticsService). Она отдаёт больше звонков, чем программный
      # портал — замер 15.10.2026 за сутки: 70 против 46, — и не ложится
      # вместе с порталом на техработы (15.10 портал отвечал 503 восемь
      # часов, и задача падала каждый час). Ходит она по cookies кабинета,
      # поэтому сессию надо разложить из секрета — так же, как это делают
      # «Прочие задачи» и «Отзывы». Секрета нет — задача не падает: скрипт
      # вернётся на портал и скажет об этом в логе.
      - name: Положить сессию кабинета АТС
        working-directory: work
        env:
          BEELINE_STORAGE_STATE: ${{ secrets.BEELINE_STORAGE_STATE }}
        run: |
          mkdir -p data
          python - <<'PY'
          import base64, os, pathlib
          значение = os.environ.get("BEELINE_STORAGE_STATE", "").strip()
          if not значение:
              print("секрета сессии нет — журнал будет читаться порталом")
              raise SystemExit(0)
          pathlib.Path("data/beeline_storage_state.json").write_bytes(
              base64.b64decode(значение))
          print("сессия кабинета разложена")
          PY

      - name: Разобрать свежие звонки
        working-directory: work
        env:
          BEELINE_API_TOKEN: ${{ secrets.BEELINE_API_TOKEN }}
          BEELINE_API_BASE_URL: ${{ secrets.BEELINE_API_BASE_URL }}
          # 15.10.2026. Окно поднято с 36 до 96 часов на время сбоя у Билайна.
          # Что случилось: их программный доступ (/apis/portal) и служба, где
          # лежат сами записи разговоров (file-storage), отвечают 503, при этом
          # кабинет и журнал звонков работают. Без записи нет расшифровки, а без
          # расшифровки встречу в разговоре не найти — значит прогоны будут
          # пустыми, пока Билайн не починит свои службы.
          #
          # Окно в 36 часов на это время мало: разбор идёт по 25 звонков за
          # прогон, и накопленное надо успеть разгрести, пока звонки не выпали
          # из окна. 96 часов дают на это трое суток с запасом. Вернуть 36
          # (или убрать строку) — когда службы Билайна поднимутся и хвост
          # разберётся; лишнее окно стоит только лишних обращений к модели.
          APPOINTMENTS_HOURS: '96'
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_ANALYSIS_MODEL: ${{ secrets.GROQ_ANALYSIS_MODEL }}
          PAID_LLM_API_KEY: ${{ secrets.PAID_LLM_API_KEY }}
          PAID_LLM_BASE_URL: ${{ secrets.PAID_LLM_BASE_URL }}
        run: python cloud_appointments.py

      - name: Вернуть журнал в приватный репозиторий
        working-directory: work
        env:
          TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          git config user.name "Sandow Bot"
          git config user.email "bot@sandowfitness.ru"
          git add data/conversions/appointments.jsonl data/conversions/processed_calls.json
          git diff --staged --quiet || (
            git commit -m "Назначенные встречи из звонков" &&
            # Задачи идут одновременно и пишут состояние в один репозиторий.
            # Кто пришёл вторым, получал отказ «fetch first» и терял свою
            # запись — тогда следующий запуск слал те же уведомления заново.
            git push "https://x-access-token:${TOKEN}@github.com/aum151-commits/sandow-automation.git" HEAD:main || (
              git pull --rebase "https://x-access-token:${TOKEN}@github.com/aum151-commits/sandow-automation.git" main &&
              git push "https://x-access-token:${TOKEN}@github.com/aum151-commits/sandow-automation.git" HEAD:main
            )
          )
