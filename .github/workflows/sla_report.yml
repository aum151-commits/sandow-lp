# SLA заявок — скорость первого касания («Беру в работу»), в группу
# «SF отчеты». Источник — data/lead_response_log.json, который пишет
# sandow-lead-bot (site_lead() и Telegram-квиз, оба с v20 от 27.09.2026).
#
# Пара с конверсиями (conversions.yml) по устройству: то же окно
# (после 11:40 МСК), тот же чат, но отдельное состояние (state_sla.json) —
# сбой одного отчёта не должен молчать за счёт отметки другого.
#
# Задача из плана «лид → встреча» (27.09.2026, Шаг 1.1): раньше журнал
# писался, но никто его не читал — эта задача закрывает именно чтение.
# Честная оговорка внутри самого отчёта: время до клика «Беру в работу»,
# не факт звонка — сцепка со звонками Билайна не сделана, это следующий шаг.
name: SLA заявок

on:
  schedule:
    - cron: '10 * * * *'
  workflow_dispatch:

env:
  TZ: Europe/Moscow

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Взять цифры из приватного репозитория
        env:
          TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          git clone --depth 1 \
            "https://x-access-token:${TOKEN}@github.com/aum151-commits/sandow-automation.git" work

      - run: pip install requests

      - name: Отправить сводку, если пришло время
        working-directory: work
        env:
          TELEGRAM_REPORT_BOT_TOKEN: ${{ secrets.TELEGRAM_REPORT_BOT_TOKEN }}
          TELEGRAM_MANAGEMENT_CHAT_ID: ${{ secrets.TELEGRAM_MANAGEMENT_CHAT_ID }}
          # 16.10.2026. Журнал заявок ведёт Россия: источник отчёта берётся из
          # бакета, репозиторий остаётся запасным путём. Ключи — из секретов.
          YC_S3_KEY_ID: ${{ secrets.YC_S3_KEY_ID }}
          YC_S3_SECRET: ${{ secrets.YC_S3_SECRET }}
        run: python report_sla.py

      - name: Запомнить, что сводка отправлена
        working-directory: work
        if: always()
        env:
          TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          git config user.name "Sandow Bot"
          git config user.email "bot@sandowfitness.ru"
          git add state_sla.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "отметка не менялась — сохранять нечего"
            exit 0
          fi
          git commit -m "Отметка отправленной SLA-сводки"
          URL="https://x-access-token:${TOKEN}@github.com/aum151-commits/sandow-automation.git"
          # 14.11.2026. Разбор жалобы Ольги «бот прислал несколько раз
          # одно и то же сообщение». Сообщение уходило в группу, а отметка
          # «за сегодня отправлено» не сохранялась: сервер отклонял запись,
          # потому что в этот же репозиторий пишут другие задачи, а
          # повторная попытка срывалась из-за несохранённых файлов в
          # рабочей папке. Без отметки следующий запуск слал ту же сводку
          # снова и снова (12.11 — 3 копии, 13.11 — 2, 14.11 — 4).
          # Теперь: запись повторяется до успеха, несохранённые файлы ей не
          # мешают, и в конце отметка сверяется с сервером.
          saved=0
          for attempt in 1 2 3 4 5 6 7 8; do
            if git -c rebase.autoStash=true pull --rebase "$URL" main >/dev/null 2>&1 &&
               git push "$URL" HEAD:main >/dev/null 2>&1; then
              saved=1
              echo "отметка сохранена с попытки ${attempt}"
              break
            fi
            sleep 8
          done
          if [ "$saved" = "0" ]; then
            echo "::error::отметка об отправке не сохранилась за восемь попыток"
          fi
          git fetch "$URL" main >/dev/null 2>&1
          if diff -q <(git show FETCH_HEAD:state_sla.json 2>/dev/null | tr -d '\r') <(tr -d '\r' < state_sla.json) >/dev/null; then
            echo "проверено: отметка на сервере совпадает с отправленной"
          else
            echo "::error::отметка на сервере не совпала — следующий запуск может повторить отправку"
            exit 1
          fi
