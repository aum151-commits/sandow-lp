# Заявки и скорость первого касания («Беру в работу») — в группу «SF отчеты».
#
# 18.11.2026. Ольга: «зачем в группе SF отчеты постоянно приходит этот нулевой
# отчет???». Причина была не в поломке, а в охвате: отчёт считал только два
# канала (форма на сайте и Телеграм-бот), где заявок приходит единица-две за
# неделю. Теперь в отчёте три канала заявок (сайт, бот, карточка Яндекса) и
# звонки в клуб, а если за сутки не было ничего — отчёт не отправляется вовсе.
#
# Пара с конверсиями (conversions.yml) по устройству: то же окно
# (после 11:40 МСК), тот же чат, но отдельное состояние (state_sla.json) —
# сбой одного отчёта не должен молчать за счёт отметки другого.
#
# Ручной запуск с галочкой «проверка» собирает отчёт и печатает его в журнал,
# ничего не отправляя: проверять надо чтением, а не «отправим и посмотрим».
name: Заявки и скорость ответа

on:
  schedule:
    - cron: '10 * * * *'
  workflow_dispatch:
    inputs:
      # Имя параметра латиницей нарочно: GitHub не разбирает кириллицу в
      # выражении ${{ inputs.* }} и отклоняет задачу целиком (проверено
      # 18.11.2026). Пояснение для человека — по-русски.
      dry_run:
        description: 'Только проверить: собрать отчёт и напечатать, в группу не слать'
        type: boolean
        default: false

env:
  TZ: Europe/Moscow

# 16.11.2026. Замок от двойной отправки — как у конверсий (conversions.yml).
# Обе задачи поднимают расписание GitHub и будильник задач; когда они
# попадают в одну минуту, второй прогон читает отметку «ещё не отправлено»
# и шлёт ту же сводку в группу «SF отчеты» второй раз.
concurrency:
  group: sla-report-send
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Взять цифры из приватного репозитория
        env:
          TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          git clone --depth 1 \
            "https://x-access-token:${TOKEN}@github.com/aum151-commits/sandow-automation.git" work

      - run: pip install requests

      - name: Отправить сводку, если пришло время
        working-directory: work
        env:
          TELEGRAM_REPORT_BOT_TOKEN: ${{ secrets.TELEGRAM_REPORT_BOT_TOKEN }}
          TELEGRAM_MANAGEMENT_CHAT_ID: ${{ secrets.TELEGRAM_MANAGEMENT_CHAT_ID }}
          # 16.10.2026. Журнал заявок ведёт Россия: источник отчёта берётся из
          # бакета, репозиторий остаётся запасным путём. Ключи — из секретов.
          YC_S3_KEY_ID: ${{ secrets.YC_S3_KEY_ID }}
          YC_S3_SECRET: ${{ secrets.YC_S3_SECRET }}
          # 18.11.2026. В отчёт добавлены звонки в клуб (без них он почти
          # каждый день был пустым). Вход в кабинет АТС — тем же секретом,
          # что у «Конверсий»: снимок входа, а не логин с паролем.
          BEELINE_STORAGE_STATE: ${{ secrets.BEELINE_STORAGE_STATE }}
        run: python report_sla.py ${{ inputs.dry_run && '--проверка' || '' }}

      - name: Проверить, что отметка дошла до сервера
        # 16.11.2026. Отметку пишет сам скрипт (отметка.py): коммит ложится на
        # вершину серверной ветки, поэтому две одновременные задачи не затирают
        # друг друга. Здесь только проверка и предупреждение.
        working-directory: work
        if: always()
        run: |
          python - <<'PY'
          import отметка
          имя = "state_sla.json"
          своя = отметка.прочитать(имя)
          серверная = отметка.прочитать_с_сервера(имя)
          if not своя.get("время"):
              print("отметку ставить было нечего")
          elif all(серверная.get(поле) == значение for поле, значение in своя.items()):
              print("проверено: отметка на сервере совпадает с отправленной")
          else:
              print("::warning::отметка на сервере не совпала:", серверная,
                    "ждали", своя)
          PY
