# Сторож клиентских данных — облачная половина.
#
# Зачем. Локальный сторож (Инструменты\сторож-данных.py) проверяет ноутбук и
# бессилен, когда тот выключен. А вторая половина риска живёт как раз в
# облаке: клиентские данные заявок лежат в приватном репозитории на GitHub и
# на Render — обе площадки в США (152-ФЗ, локализация). Этот сторож смотрит
# оттуда и пишет Ольге в личку, если что-то поехало.
#
# Что проверяет:
#   1. приватный бакет Яндекс.Облака закрыт (403 без ключа);
#   2. облачная функция «по номеру — имя» без ключа отвечает 403;
#   3. в приватном репозитории нет файлов с клиентскими данными и снимков
#      входов — ни по именам, ни по содержимому (скопление телефонов);
#   4. в этом публичном репозитории нет выгрузок клиентов.
#
# Живёт в публичном репозитории по той же причине, что и остальные сторожа:
# минуты Actions в публичном репозитории бесплатны без лимита, а приватный
# однажды уже исчерпал их и 5,5 суток молча не работал (25–31.08.2026).
#
# Сообщение уходит ТОЛЬКО Ольге в личку (правило §0г) и только при проблеме.
# В понедельник и при ручном запуске — короткая строка «всё в порядке»: иначе
# нельзя отличить «всё хорошо» от «сторож перестал запускаться».
name: Сторож клиентских данных

on:
  schedule:
    - cron: '35 5 * * *'    # 08:35 МСК — до открытия отдела в 10:00
  workflow_dispatch:
    # Ручной запуск всегда присылает короткую строку «всё в порядке»: это
    # способ проверить сам канал связи, не дожидаясь сбоя.

env:
  TZ: Europe/Moscow

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Проверить данные, бакет и доступы
        # Зависимостей нет нарочно: проверка не должна падать из-за
        # недоступного pip — её задача сообщать о чужих сбоях.
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN_MARKETING }}
          LOOKUP_URL: ${{ secrets.LOOKUP_URL }}
          # Ключи облака нужны, чтобы проверить свежесть копии данных в России:
          # перенос держится на зеркалах, а зеркало может замолчать молча.
          YC_S3_KEY_ID: ${{ secrets.YC_S3_KEY_ID }}
          YC_S3_SECRET: ${{ secrets.YC_S3_SECRET }}
          CHECK_REPORT: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: python data_guard.py
