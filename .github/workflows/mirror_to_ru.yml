# Свежая копия клиентских данных в России — каждые 15 минут.
#
# Зачем: по 152-ФЗ (ч. 5 ст. 18) персональные данные россиян должны храниться
# в базах на территории России, а основной путь у нас пока — приватный
# репозиторий на GitHub (США). Бот (заявки, подписчики) зеркалит свои файлы
# сам, при каждой записи; эта задача закрывает остальной контур: отметки
# продаж, встречи, очереди приёма, авторов. Пока это КОПИЯ, а не перенос:
# репозиторий остаётся основным, но в России всегда лежит свежая версия —
# и когда ноутбук выключен тоже.
#
# Живёт в публичном репозитории нарочно: минуты Actions здесь бесплатны без
# лимита, а приватный репозиторий однажды уже исчерпал их и молчал 5,5 суток
# (25–31.08.2026).
name: Копия данных в России

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

env:
  TZ: Europe/Moscow

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Установить boto3
        run: pip install --quiet boto3

      - name: Обновить копию в России
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          YC_S3_KEY_ID: ${{ secrets.YC_S3_KEY_ID }}
          YC_S3_SECRET: ${{ secrets.YC_S3_SECRET }}
          S3_BUCKET: sandow-lead-data
        run: python mirror_to_ru.py
