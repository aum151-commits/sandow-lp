# Сверка живых страниц с правилами клуба (цены, латиница, ММА, запрещённые
# услуги) — раньше только на компьютере Ольги («Сандов - соответствие
# правилам»), задача выключена с конца августа, проверки не было минимум
# три недели. compliance_scan.py не трогает Тильду вообще — только читает
# уже опубликованные страницы через requests, переносится в облако без
# риска капчи или сессий (в отличие от задач, которым нужен вход в Тильду).
#
# Живёт в публичном репозитории намеренно: здесь минуты Actions бесплатны.
name: Соответствие правилам

on:
  schedule:
    - cron: '15 6 * * 1'   # понедельник 9:15 МСК — тот же ритм, что был на компьютере
  workflow_dispatch:

env:
  TZ: Europe/Moscow

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Взять код из приватного репозитория
        env:
          TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          git clone --depth 1 \
            "https://x-access-token:${TOKEN}@github.com/aum151-commits/sandow-automation.git" work
          echo "код получен"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Поставить зависимости
        run: pip install requests

      - name: Прогнать сверку
        working-directory: work
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: python compliance_scan.py --verbose
