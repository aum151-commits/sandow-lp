# Мониторинг запросов журналистов Pressfeed (задача Ольги 13.09: вариант А,
# пресса — зона сессии кампаний). Дайджесты queries@pressfeed.ru приходят
# на sandow.reports@ дважды в день; фильтр раз в день вылавливает запросы,
# на которые клубу реально есть что ответить.
#
# ПЕРЕДЕЛАНО 25.09.2026 по решению Ольги. Было: сырой список кандидатов
# уходил ей в личку, и она должна была из него выбирать. Её слова: «не могу
# понять, что от меня требуется и что это нам даст». Замер за две недели
# показал, почему это не работало: из 557 запросов журналистов фильтр
# пропускал 11, а нашими по сути были ДВА («комментарий тренера о
# тренировках при боли в шее», «…с одной гантелью», оба — журнал ЖИВИ!).
# Остальные девять — мусор, причём часть из-за грубой ошибки: в регулярке
# слово «спорт» стояло без границы слова, поэтому ловилось «тран-СПОРТ-ной»
# и приезжали запросы про транспортную безопасность и паспорта готовности
# к отопительному сезону. Ещё три были про нутрициологов и диетологов —
# а клубу нельзя называть своих специалистов диетологами (CLAUDE.md, 3а).
#
# Стало: фильтр строгий и МОЛЧАЛИВЫЙ. Кандидаты складываются в закрытый
# репозиторий (data/pressfeed_candidates.json), Ольге не пишется ничего.
# Разбирает их сессия: если запрос стоящий — готовит текст комментария и
# приносит Ольге ГОТОВЫМ, на «да/нет», через обычный гейт для текстов прессы.
# Лимит бесплатного тарифа — 1 ответ в месяц, так что чаще и не нужно.
name: Pressfeed - фильтр запросов журналистов

on:
  schedule:
    - cron: '20 15 * * *'   # ~18:20 МСК, после обоих дневных дайджестов
  workflow_dispatch: {}

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Фильтр дайджестов и отправка кандидатов
        env:
          LOGIN: ${{ secrets.MAIL_SANDOW_LOGIN }}
          PASSWORD: ${{ secrets.MAIL_SANDOW_APP_PASSWORD }}
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        shell: python
        run: |
          import base64, email, imaplib, json, os, re, time
          import urllib.error, urllib.request
          from datetime import datetime, timedelta, timezone
          from email.header import decode_header

          def dec(raw):
              if not raw: return ""
              return "".join(t.decode(e or "utf-8", "replace") if isinstance(t, bytes) else t
                             for t, e in decode_header(raw))

          M = imaplib.IMAP4_SSL("imap.yandex.ru", 993)
          M.login(os.environ["LOGIN"], os.environ["PASSWORD"])
          M.select("INBOX", readonly=True)
          since = (datetime.now(timezone.utc) - timedelta(hours=30)).strftime("%d-%b-%Y")

          # Поиск на Яндекс-почте периодически отвечает
          # «NO [UNAVAILABLE] SEARCH Backend error» — это сбой на их
          # стороне, не в наших данных. Проверено вживую 25.09.2026:
          # первая попытка упала, вторая тем же запросом прошла.
          # Поэтому: повторяем составной поиск, а если он не даётся
          # вовсе — берём письма только по дате (простой запрос почта
          # держит надёжнее) и отбираем отправителя сами.
          def числа(ответ):
              return [x for x in ответ.split() if x.isdigit()]

          ids, способ = None, ""
          for попытка in range(4):
              typ, data = M.search(None, 'FROM', '"queries@pressfeed.ru"',
                                   'SINCE', since)
              if typ == "OK" and data and data[0] is not None:
                  ids, способ = числа(data[0]), "поиск по отправителю"
                  break
              print(f"попытка {попытка + 1}: почта ответила {typ} {str(data)[:100]}")
              time.sleep(5 * (попытка + 1))

          if ids is None:
              typ, data = M.search(None, 'SINCE', since)
              if typ != "OK" or not data or data[0] is None:
                  raise RuntimeError(f"поиск писем не удался даже по дате: {typ} {data!r}")
              ids, способ = [], "запасной путь — отбор по заголовку"
              for i in числа(data[0]):
                  t, d = M.fetch(i, "(BODY.PEEK[HEADER.FIELDS (FROM)])")
                  шапка = d[0][1].decode("utf-8", "replace") if t == "OK" and d and d[0] else ""
                  if "queries@pressfeed.ru" in шапка.lower():
                      ids.append(i)

          print(f"дайджестов за 30 часов: {len(ids)} ({способ})")

          # Берём только то, где экспертом просят именно тренера или клуб.
          # Границы слова \b обязательны: без них «спорт» ловил
          # «транСПОРТной». В Python \b работает с кириллицей корректно
          # (в отличие от JS — см. память js-regex-word-boundary-breaks-cyrillic).
          KEYS = re.compile(
              r"\bтренер|\bтрениров|\bтренаж|\bфитнес|\bспорт\b|\bспортзал|"
              r"\bкачалк|\bабонемент|\bупражнен|\bмышц|\bрастяжк|\bосанк|"
              r"\bсутул|\bединобор|\bбокс|\bйог[аиу]|\bпохуд|\bвыносливост|"
              r"\bразминк|\bсауна|\bсилов(?:ая|ой|ых|ые)|\bзож\b|"
              r"\bбег(?:а|ом|е|у|ов)?\b", re.I)

          # Темы, на которые клубу отвечать НЕЛЬЗЯ или нечем — режем сразу,
          # чтобы они не занимали единственный бесплатный ответ в месяц:
          # диетология и нутрициология (своих специалистов так называть
          # запрещено, CLAUDE.md 3а), медицина и врачи (врачей в клубе нет),
          # детские секции (групповых нет), а также транспорт/киберспорт/
          # ставки — они попадали по созвучию.
          # Слово «врач» в стоп-список НЕ ставим, хотя напрашивается:
          # проверка на реальных письмах показала, что оно убивает
          # «комментарий тренера ИЛИ врача о тренировках с одной гантелью» —
          # запрос, где тренер прямо назван как подходящий эксперт. Чисто
          # врачебные темы сюда и так не доходят: они не проходят KEYS,
          # раз оттуда убраны «здоров» и «питани».
          STOP = re.compile(
              r"нутрициол|диетолог|диет[аыуе]\b|школьн(?:ое|ого) питани|"
              r"медицин|долголети|вегетариан|веган|"
              r"для глаз|зрени|"          # гимнастика для глаз — не наша тема
              r"транспорт|киберспорт|тотализатор|букмекер|"
              r"отоплени|паспорт(?:а|ов)? готовности|"
              r"спортивн(?:ое|ый) пита(?:ние)? для животн", re.I)

          Q_RE = re.compile(
              r"\d+\.\s*(.{5,160}?)\s*\(\s*https?://service\.pressfeed\S*?\s*\)\s*"
              r"([^()]{3,80}?)\s*\(до\s+([^)]{4,40})\)")

          seen, hits = set(), []
          for i in ids:
              typ, msg_data = M.fetch(i, "(RFC822)")
              msg = email.message_from_bytes(msg_data[0][1])
              body = ""
              for part in msg.walk():
                  if part.get_content_type() == "text/plain":
                      body = part.get_payload(decode=True).decode("utf-8", "replace"); break
              if not body:
                  for part in msg.walk():
                      if part.get_content_type() == "text/html":
                          h = part.get_payload(decode=True).decode("utf-8", "replace")
                          body = re.sub(r"<[^>]+>", " ", h); break
              flat = re.sub(r"\s+", " ", body)
              for title, outlet, deadline in Q_RE.findall(flat):
                  title = title.strip(" .")
                  if title.lower() in seen: continue
                  seen.add(title.lower())
                  if KEYS.search(title) and not STOP.search(title):
                      hits.append((title, outlet.strip(), deadline.strip()))
          M.logout()
          print("совпадений:", len(hits))

          # Кандидаты НЕ уходят Ольге. Они складываются в закрытый
          # репозиторий, откуда их разбирает сессия: выбирает стоящий
          # запрос, готовит текст комментария и приносит Ольге готовым.
          # Прежнее поведение (сырой список ей в личку) отменено 25.09.2026
          # её решением — см. шапку файла.
          сейчас = datetime.now(timezone.utc)
          урл_файла = ("https://api.github.com/repos/aum151-commits"
                       "/sandow-automation/contents/data/pressfeed_candidates.json")
          гх_шапка = {"Authorization": f"Bearer {os.environ['REPO_TOKEN']}",
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "sandow-pressfeed"}

          def прочитать():
              try:
                  зп = urllib.request.Request(урл_файла, headers=гх_шапка)
                  with urllib.request.urlopen(зп, timeout=30) as о:
                      д = json.loads(о.read().decode())
                  return json.loads(base64.b64decode(д["content"]).decode()), д["sha"]
              except urllib.error.HTTPError as e:
                  if e.code == 404:
                      return {"обновлено": "", "кандидаты": []}, None
                  raise

          данные, sha = прочитать()
          было = {к["тема"].lower() for к in данные.get("кандидаты", [])}
          новых = 0
          for t, o, d in hits:
              if t.lower() in было:
                  continue
              данные["кандидаты"].append({
                  "тема": t, "издание": o, "срок": d,
                  "найдено": сейчас.strftime("%Y-%m-%d"),
                  "статус": "новый",
              })
              новых += 1

          # Старьё не копим: запросы живут днями, через два месяца они
          # мусор, а файл должен оставаться читаемым глазами.
          граница = (сейчас - timedelta(days=60)).strftime("%Y-%m-%d")
          до = len(данные["кандидаты"])
          данные["кандидаты"] = [к for к in данные["кандидаты"]
                                 if к.get("найдено", "") >= граница]
          # Отметка времени нужна вместо недельного сообщения «я жив»:
          # Ольге сообщения больше не шлём, а свежесть файла показывает,
          # что фильтр работает, — её видно и сессии, и стороннему сторожу.
          данные["обновлено"] = сейчас.strftime("%Y-%m-%d %H:%M UTC")

          тело = {"message": f"Pressfeed: кандидатов +{новых}",
                  "content": base64.b64encode(
                      json.dumps(данные, ensure_ascii=False, indent=1)
                      .encode()).decode()}
          if sha:
              тело["sha"] = sha
          зп = urllib.request.Request(урл_файла, method="PUT", headers=dict(
              гх_шапка, **{"Content-Type": "application/json"}),
              data=json.dumps(тело).encode())
          with urllib.request.urlopen(зп, timeout=30) as о:
              print(f"записано в хранилище: новых {новых}, "
                    f"просрочено убрано {до - len(данные['кандидаты'])}, "
                    f"всего в файле {len(данные['кандидаты'])}")

      # Если шаг выше упал — говорим об этом вслух, но НЕ каждый день.
      # Молчащая задача неотличима от спокойной (падение 20–23.09.2026
      # никто не заметил четыре дня) — поэтому сообщать надо. Но 24.09
      # вышла обратная крайность: почта Яндекса сбоит плавающе, и Ольге
      # уходило сообщение о падении каждый вечер. Её требование прямое —
      # «только о реальных проблемах». Одиночный сбой почты реальной
      # проблемой не является: он лечится сам на следующем прогоне.
      # Поэтому пишем, только когда упало ТРЕТИЙ раз подряд — это уже
      # не помеха связи, а сломанный фильтр.
      - name: Сообщить о падении, если оно не разовое
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID_OLGA }}
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: python
        run: |
          import json, os, urllib.request

          def гх(путь):
              зп = urllib.request.Request(
                  f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}{путь}",
                  headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                           "Accept": "application/vnd.github+json"})
              with urllib.request.urlopen(зп, timeout=30) as о:
                  return json.loads(о.read().decode())

          # Считаем, сколько прогонов подряд закончились неудачей,
          # начиная с текущего (он ещё идёт — его считаем сами).
          подряд = 1
          try:
              прошлые = гх(f"/actions/workflows/pressfeed_watch.yml/runs"
                           f"?per_page=6&status=completed")["workflow_runs"]
              for п in прошлые:
                  if п["id"] == int(os.environ.get("GITHUB_RUN_ID", 0)):
                      continue
                  if п["conclusion"] == "failure":
                      подряд += 1
                  else:
                      break
          except Exception as e:          # noqa: BLE001
              print("историю прогонов получить не удалось:", e)
              подряд = 3                  # не знаем — лучше сказать

          print("неудач подряд:", подряд)
          if подряд < 3:
              print("разовый сбой почты — молчим, поправится сам")
              raise SystemExit(0)

          текст = (f"Pressfeed: фильтр запросов журналистов падает "
                   f"{подряд}-й раз подряд и запросы прессы не проверяются.\n\n"
                   + os.environ["RUN_URL"])
          urllib.request.urlopen(urllib.request.Request(
              f"https://api.telegram.org/bot{os.environ['TG_TOKEN']}/sendMessage",
              data=json.dumps({"chat_id": os.environ["TG_CHAT"],
                               "text": текст}).encode(),
              headers={"Content-Type": "application/json"}), timeout=30)
