# Мониторинг запросов журналистов Pressfeed (задача Ольги 13.09: вариант А,
# пресса — зона сессии кампаний). Дайджесты queries@pressfeed.ru приходят
# на sandow.reports@ дважды в день; этот фильтр раз в день вылавливает
# запросы по темам клуба (фитнес/спорт/ЗОЖ) и шлёт Ольге кандидатов.
# Лимит бесплатного тарифа — 1 ответ в месяц, поэтому только информирование:
# сам ответ готовится сессией и идёт через гейт (тексты для прессы).
name: Pressfeed - фильтр запросов журналистов

on:
  schedule:
    - cron: '20 15 * * *'   # ~18:20 МСК, после обоих дневных дайджестов
  workflow_dispatch: {}

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Фильтр дайджестов и отправка кандидатов
        env:
          LOGIN: ${{ secrets.MAIL_SANDOW_LOGIN }}
          PASSWORD: ${{ secrets.MAIL_SANDOW_APP_PASSWORD }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID_OLGA }}
        shell: python
        run: |
          import email, imaplib, json, os, re, time, urllib.request
          from datetime import datetime, timedelta, timezone
          from email.header import decode_header

          def dec(raw):
              if not raw: return ""
              return "".join(t.decode(e or "utf-8", "replace") if isinstance(t, bytes) else t
                             for t, e in decode_header(raw))

          M = imaplib.IMAP4_SSL("imap.yandex.ru", 993)
          M.login(os.environ["LOGIN"], os.environ["PASSWORD"])
          M.select("INBOX", readonly=True)
          since = (datetime.now(timezone.utc) - timedelta(hours=30)).strftime("%d-%b-%Y")

          # Поиск на Яндекс-почте периодически отвечает
          # «NO [UNAVAILABLE] SEARCH Backend error» — это сбой на их
          # стороне, не в наших данных. Проверено вживую 25.09.2026:
          # первая попытка упала, вторая тем же запросом прошла.
          # Поэтому: повторяем составной поиск, а если он не даётся
          # вовсе — берём письма только по дате (простой запрос почта
          # держит надёжнее) и отбираем отправителя сами.
          def числа(ответ):
              return [x for x in ответ.split() if x.isdigit()]

          ids, способ = None, ""
          for попытка in range(4):
              typ, data = M.search(None, 'FROM', '"queries@pressfeed.ru"',
                                   'SINCE', since)
              if typ == "OK" and data and data[0] is not None:
                  ids, способ = числа(data[0]), "поиск по отправителю"
                  break
              print(f"попытка {попытка + 1}: почта ответила {typ} {str(data)[:100]}")
              time.sleep(5 * (попытка + 1))

          if ids is None:
              typ, data = M.search(None, 'SINCE', since)
              if typ != "OK" or not data or data[0] is None:
                  raise RuntimeError(f"поиск писем не удался даже по дате: {typ} {data!r}")
              ids, способ = [], "запасной путь — отбор по заголовку"
              for i in числа(data[0]):
                  t, d = M.fetch(i, "(BODY.PEEK[HEADER.FIELDS (FROM)])")
                  шапка = d[0][1].decode("utf-8", "replace") if t == "OK" and d and d[0] else ""
                  if "queries@pressfeed.ru" in шапка.lower():
                      ids.append(i)

          print(f"дайджестов за 30 часов: {len(ids)} ({способ})")

          KEYS = re.compile(
              r"фитнес|спорт|трениров|тренаж|похуд|зож|здоров|питани|нутрициол|"
              r"бег(?:а|ом|е|у|ов)?\b|мышц|единобор|бокс|йог[аиу]|растяж|осанк|сутул|"
              r"сауна|восстановлен|сил(?:овая|овой|овых)|выносливост|разминк|"
              r"абонемент|качалк|спортзал", re.I)
          # ложные срабатывания: транспорт/госспорт и т.п. отсекаем стоп-словами
          STOP = re.compile(r"киберспорт|спортивн(?:ое|ый) пита(?:ние)? для животн|тотализатор|букмекер", re.I)

          Q_RE = re.compile(
              r"\d+\.\s*(.{5,160}?)\s*\(\s*https?://service\.pressfeed\S*?\s*\)\s*"
              r"([^()]{3,80}?)\s*\(до\s+([^)]{4,40})\)")

          seen, hits = set(), []
          for i in ids:
              typ, msg_data = M.fetch(i, "(RFC822)")
              msg = email.message_from_bytes(msg_data[0][1])
              body = ""
              for part in msg.walk():
                  if part.get_content_type() == "text/plain":
                      body = part.get_payload(decode=True).decode("utf-8", "replace"); break
              if not body:
                  for part in msg.walk():
                      if part.get_content_type() == "text/html":
                          h = part.get_payload(decode=True).decode("utf-8", "replace")
                          body = re.sub(r"<[^>]+>", " ", h); break
              flat = re.sub(r"\s+", " ", body)
              for title, outlet, deadline in Q_RE.findall(flat):
                  title = title.strip(" .")
                  if title.lower() in seen: continue
                  seen.add(title.lower())
                  if KEYS.search(title) and not STOP.search(title):
                      hits.append((title, outlet.strip(), deadline.strip()))
          M.logout()
          print("совпадений:", len(hits))

          if hits:
              lines = ["Запросы журналистов по нашим темам (Pressfeed, авто-фильтр):", ""]
              for n, (t, o, d) in enumerate(hits[:10], 1):
                  lines.append(f"{n}. {t} — {o} (до {d})")
              lines.append("")
              lines.append("Лимит бесплатного тарифа — 1 ответ в месяц. Если какой-то запрос стоит взять — ответьте его номером, текст комментария подготовлю и покажу перед отправкой.")
              text = "\n".join(lines)[:4000]
              req = urllib.request.Request(
                  f"https://api.telegram.org/bot{os.environ['TG_TOKEN']}/sendMessage",
                  data=json.dumps({"chat_id": os.environ["TG_CHAT"], "text": text}).encode(),
                  headers={"Content-Type": "application/json"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  print("telegram:", r.status)
          else:
              print("подходящих запросов нет — молчим")

          # Раз в неделю (понедельник) отчёт подаёт голос, даже если
          # новостей нет. Причина: молчание упавшей задачи неотличимо от
          # молчания «всё спокойно» — из-за этого падение 20–23.09 никто
          # не заметил четыре дня. Пусть тишина будет сигналом.
          if datetime.now(timezone.utc).weekday() == 0 and not hits:
              урл = f"https://api.telegram.org/bot{os.environ['TG_TOKEN']}/sendMessage"
              тело = json.dumps({
                  "chat_id": os.environ["TG_CHAT"],
                  "text": ("Pressfeed: фильтр работает, за неделю подходящих "
                           "запросов журналистов не было."),
              }).encode()
              urllib.request.urlopen(
                  urllib.request.Request(
                      урл, data=тело,
                      headers={"Content-Type": "application/json"}),
                  timeout=30)
              print("отправлена недельная отметка «жив»")

      # Если шаг выше упал — говорим об этом вслух, но НЕ каждый день.
      # Молчащая задача неотличима от спокойной (падение 20–23.09.2026
      # никто не заметил четыре дня) — поэтому сообщать надо. Но 24.09
      # вышла обратная крайность: почта Яндекса сбоит плавающе, и Ольге
      # уходило сообщение о падении каждый вечер. Её требование прямое —
      # «только о реальных проблемах». Одиночный сбой почты реальной
      # проблемой не является: он лечится сам на следующем прогоне.
      # Поэтому пишем, только когда упало ТРЕТИЙ раз подряд — это уже
      # не помеха связи, а сломанный фильтр.
      - name: Сообщить о падении, если оно не разовое
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID_OLGA }}
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: python
        run: |
          import json, os, urllib.request

          def гх(путь):
              зп = urllib.request.Request(
                  f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}{путь}",
                  headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                           "Accept": "application/vnd.github+json"})
              with urllib.request.urlopen(зп, timeout=30) as о:
                  return json.loads(о.read().decode())

          # Считаем, сколько прогонов подряд закончились неудачей,
          # начиная с текущего (он ещё идёт — его считаем сами).
          подряд = 1
          try:
              прошлые = гх(f"/actions/workflows/pressfeed_watch.yml/runs"
                           f"?per_page=6&status=completed")["workflow_runs"]
              for п in прошлые:
                  if п["id"] == int(os.environ.get("GITHUB_RUN_ID", 0)):
                      continue
                  if п["conclusion"] == "failure":
                      подряд += 1
                  else:
                      break
          except Exception as e:          # noqa: BLE001
              print("историю прогонов получить не удалось:", e)
              подряд = 3                  # не знаем — лучше сказать

          print("неудач подряд:", подряд)
          if подряд < 3:
              print("разовый сбой почты — молчим, поправится сам")
              raise SystemExit(0)

          текст = (f"Pressfeed: фильтр запросов журналистов падает "
                   f"{подряд}-й раз подряд и запросы прессы не проверяются.\n\n"
                   + os.environ["RUN_URL"])
          urllib.request.urlopen(urllib.request.Request(
              f"https://api.telegram.org/bot{os.environ['TG_TOKEN']}/sendMessage",
              data=json.dumps({"chat_id": os.environ["TG_CHAT"],
                               "text": текст}).encode(),
              headers={"Content-Type": "application/json"}), timeout=30)
