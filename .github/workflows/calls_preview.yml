# ВРЕМЕННАЯ задача: показать Ольге, как выглядит сообщение с подписью
# «кто звонит». Запускается вручную, работает в режиме --preview: пишет
# ТОЛЬКО Ольге в личку, в группу заявок не отправляет ничего и состояние
# сторожа не меняет (пропущенные не помечаются отправленными).
#
# Живёт в публичном репозитории по той же причине, что и сам сторож:
# минуты Actions в публичном репозитории бесплатны без лимита, а приватный
# однажды уже исчерпал их и 5,5 суток молча не работал.
name: Звонки — предпросмотр подписи

on:
  workflow_dispatch:

env:
  TZ: Europe/Moscow

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Взять код
        env:
          TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          git clone --depth 1 \
            "https://x-access-token:${TOKEN}@github.com/aum151-commits/sandow-automation.git" work

      - name: Поставить зависимости
        working-directory: work/rpa
        run: |
          pip install requests playwright python-dotenv openpyxl beautifulsoup4
          playwright install --with-deps chromium

      - name: Разложить сессию АТС
        working-directory: work/rpa
        env:
          BEELINE_STORAGE_STATE: ${{ secrets.BEELINE_STORAGE_STATE }}
        run: |
          mkdir -p data
          python - <<'PY'
          import base64, os, pathlib
          значение = os.environ.get("BEELINE_STORAGE_STATE", "").strip()
          if значение:
              данные = base64.b64decode(значение)
              if not данные.lstrip().startswith(b"{"):
                  данные = значение.encode("utf-8")
              pathlib.Path("data/beeline_storage_state.json").write_bytes(данные)
              print("сессия АТС разложена")
          else:
              print("сессии АТС нет — вход пойдёт по логину и паролю")
          PY

      - name: Дневной сторож — предпросмотр
        working-directory: work/rpa
        continue-on-error: true
        env:
          BEELINE_PBX_LOGIN: ${{ secrets.BEELINE_PBX_LOGIN }}
          BEELINE_PBX_PASSWORD: ${{ secrets.BEELINE_PBX_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN_MARKETING }}
          LOOKUP_URL: ${{ secrets.LOOKUP_URL }}
          LOOKUP_TOKEN: ${{ secrets.LOOKUP_TOKEN }}
        run: python -m src.rpa.missed_watch --preview

      - name: Ночной отчёт — предпросмотр
        working-directory: work/rpa
        continue-on-error: true
        env:
          BEELINE_PBX_LOGIN: ${{ secrets.BEELINE_PBX_LOGIN }}
          BEELINE_PBX_PASSWORD: ${{ secrets.BEELINE_PBX_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN_MARKETING }}
          LOOKUP_URL: ${{ secrets.LOOKUP_URL }}
          LOOKUP_TOKEN: ${{ secrets.LOOKUP_TOKEN }}
        run: python -m src.rpa.night_calls_report --preview
