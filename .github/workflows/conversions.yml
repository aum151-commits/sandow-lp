# Сводка конверсий отдела продаж — отправляется из облака.
#
# Считает конверсии компьютер Ольги: там записи звонков, транскрипты и
# выгрузка 1С. Отправка вынесена в облако, чтобы отчёт выходил и при
# выключенном ноутбуке — раньше в этом случае его просто не было.
#
# Живёт в публичном репозитории: в приватном кончились бесплатные минуты.
# Цифры и журналы берутся из приватного репозитория по токену, в публичный
# лог не печатается ничего, кроме служебных строк.
#
# Запуск каждый час намеренно: расписание GitHub опаздывает, поэтому окна
# отправки широкие, а от повтора защищает отметка state_conversions.json.
name: Конверсии отдела продаж

on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:

# Время внутри задач — московское. Раннеры GitHub живут по UTC, а все
# скрипты писались для ноутбука в Москве: «тихие часы 22:00–10:00»,
# «отчёт в 13 и 17», «дата сегодня». Без этой строки они отставали
# на три часа — уведомления о пропущенных молчали до 13:00 по Москве.
# Расписание cron ниже остаётся в UTC: GitHub считает его только так.
env:
  TZ: Europe/Moscow

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Взять цифры из приватного репозитория
        env:
          TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          git clone --depth 1 \
            "https://x-access-token:${TOKEN}@github.com/aum151-commits/sandow-automation.git" work

      - name: Разложить сессию АТС
        # 10.11.2026: без этой сессии отчёт падал с «станция не отдала звонки
        # (403)» пять дней подряд, и сводка по конверсиям не выходила с 4 ноября.
        working-directory: work/rpa
        env:
          BEELINE_STORAGE_STATE: ${{ secrets.BEELINE_STORAGE_STATE }}
        run: |
          mkdir -p data
          python - <<'PY'
          import base64, os, pathlib
          значение = os.environ.get("BEELINE_STORAGE_STATE", "").strip()
          # 10.11.2026: в секрете сессия просрочена, а живой вход с раннера не
          # подтверждается. Если в репозитории лежит рабочая сессия — берём её
          # и секретом не затираем.
          готовая = pathlib.Path("data/beeline_storage_state.json")
          if готовая.exists() and готовая.stat().st_size > 100:
              print("сессия уже в репозитории — секрет не используем")
          elif значение:
              данные = base64.b64decode(значение)
              if not данные.lstrip().startswith(b"{"):
                  данные = значение.encode("utf-8")
              pathlib.Path("data/beeline_storage_state.json").write_bytes(данные)
              print("сессия АТС разложена")
          else:
              print("сессии АТС нет — вход пойдёт по логину и паролю")
          PY

      - name: Поставить браузер для входа в кабинет АТС
        # Вход в кабинет Билайна делается браузером, как в стороже звонков.
        run: |
          # requests нужен самому коду сторожа звонков: без него шаг входа
          # падал с «No module named 'requests'» и отчёт оставался без звонков.
          pip install requests python-dotenv playwright
          python -m playwright install --with-deps chromium

      - name: Освежить сессию АТС
        # 10.11.2026: сессия из секрета просрочена — станция отвечала 403, и
        # сводка по конверсиям не выходила с 4 ноября. Логинимся заново тем же
        # способом, что и сторож пропущенных звонков, и обновляем файл сессии.
        working-directory: work/rpa
        env:
          BEELINE_PBX_LOGIN: ${{ secrets.BEELINE_PBX_LOGIN }}
          BEELINE_PBX_PASSWORD: ${{ secrets.BEELINE_PBX_PASSWORD }}
        run: |
          python - <<'PY'
          from datetime import datetime, timedelta
          try:
              from src.rpa import beeline_calls as bc
              bc.fetch(datetime.now() - timedelta(minutes=30), datetime.now())
              print("сессия АТС обновлена живым входом")
          except Exception as ошибка:
              print("вход не удался, пойдём на прежней сессии:", ошибка)
          PY

      - run: pip install requests python-dotenv

      - name: Отправить сводку, если пришло время
        working-directory: work
        env:
          BEELINE_API_TOKEN: ${{ secrets.BEELINE_API_TOKEN }}
          BEELINE_API_BASE_URL: ${{ secrets.BEELINE_API_BASE_URL }}
          TELEGRAM_REPORT_BOT_TOKEN: ${{ secrets.TELEGRAM_REPORT_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID_OLGA }}
          TELEGRAM_MANAGEMENT_CHAT_ID: ${{ secrets.TELEGRAM_MANAGEMENT_CHAT_ID }}
          # 16.10.2026. «Назначено» берётся из журнала встреч, который ведёт
          # российский бакет: репозиторий получает копию и отстаёт. Ключи —
          # только из секретов, в репозитории их нет.
          YC_S3_KEY_ID: ${{ secrets.YC_S3_KEY_ID }}
          YC_S3_SECRET: ${{ secrets.YC_S3_SECRET }}
        run: python report_conversions.py

      - name: Запомнить, что сводка отправлена
        working-directory: work
        env:
          TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          git config user.name "Sandow Bot"
          git config user.email "bot@sandowfitness.ru"
          git add state_conversions.json
          git diff --staged --quiet || (
            git commit -m "Отметка отправленной сводки конверсий" &&
            # Задачи идут одновременно и пишут состояние в один репозиторий.
            # Кто пришёл вторым, получал отказ «fetch first» и терял свою
            # запись — тогда следующий запуск слал те же уведомления заново.
            git push "https://x-access-token:${TOKEN}@github.com/aum151-commits/sandow-automation.git" HEAD:main || (
              git pull --rebase "https://x-access-token:${TOKEN}@github.com/aum151-commits/sandow-automation.git" main &&
              git push "https://x-access-token:${TOKEN}@github.com/aum151-commits/sandow-automation.git" HEAD:main
            )
          )
