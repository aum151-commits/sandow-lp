# Планы и просрочки менеджерам — единственный источник, с 14.09.2026.
#
# Цепочка: администратор 1С присылает боту две выгрузки, сервер кладёт их в
# очередь, а этот процесс скачивает файлы, формирует планы, делает PDF и
# отправляет в группу «Обучалки». Прямое требование Ольги 14.09.2026:
# отправка не должна зависеть НИ ОТ ЧЕГО на её стороне — не от того,
# включён ли ноутбук, не от того, работает ли Клод. Раньше существовал
# параллельный локальный путь на компьютере Ольги — оба вместе и давали
# дубль в группе (местная и облачная версии не знали друг о друге).
# Локальные задачи Планировщика Windows («Sandow Files Intake», «Sandow
# Daily Plans») отключены совсем — эта облачная версия теперь единственная.
#
# Запускается часто, потому что выгрузки приходят в разное время, а ждать
# их полдня нельзя. Пока пришла только одна из двух — процесс тихо ждёт.
name: Планы менеджерам

on:
  schedule:
    - cron: '*/30 5-15 * * *'    # с 8 до 18 по Москве, каждые полчаса
  workflow_dispatch:

# Найдено Ольгой 14.09.2026: раньше существовал ещё и ЛОКАЛЬНЫЙ пайплайн
# на компьютере Ольги, независимо читавший ту же очередь и славший свою
# копию — оба вместе и давали дубль в группе. Локальный отключён совсем,
# эта облачная версия — единственный источник, не зависит от того,
# включён ли ноутбук вообще. concurrency ниже страхует уже внутри самого
# облака: если по какой-то причине два прогона этого workflow пересекутся
# по времени (например ручной workflow_dispatch попал на минуту
# расписания), GitHub поставит второй в очередь, а не запустит рядом —
# он увидит уже закоммиченную отметку об отправке и корректно промолчит.
concurrency:
  group: plans-menedzheram
  cancel-in-progress: false

# Время внутри задач — московское. Раннеры GitHub живут по UTC, а все
# скрипты писались для ноутбука в Москве: «тихие часы 22:00–10:00»,
# «отчёт в 13 и 17», «дата сегодня». Без этой строки они отставали
# на три часа — уведомления о пропущенных молчали до 13:00 по Москве.
# Расписание cron ниже остаётся в UTC: GitHub считает его только так.
env:
  TZ: Europe/Moscow

jobs:
  plans:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Взять код и очередь
        env:
          TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          git clone --depth 1 \
            "https://x-access-token:${TOKEN}@github.com/aum151-commits/sandow-automation.git" work

      - name: Поставить зависимости
        working-directory: work
        run: |
          pip install requests playwright openpyxl xlrd pandas python-dotenv beautifulsoup4
          playwright install --with-deps chromium

      - name: Сформировать и отправить планы
        working-directory: work
        env:
          INTAKE_BOT_TOKEN: ${{ secrets.INTAKE_BOT_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.INTAKE_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.PLANS_CHAT_ID }}
        run: python plans/plans_cloud.py

      - name: Запомнить обработанные выгрузки
        working-directory: work
        if: always()
        env:
          TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          git config user.name "Sandow Bot"
          git config user.email "bot@sandowfitness.ru"
          git add -A data/intake 2>/dev/null || true
          git diff --staged --quiet || (
            git commit -m "Планы менеджерам: отмечены обработанные выгрузки" &&
            # Задачи идут одновременно и пишут состояние в один репозиторий.
            # Кто пришёл вторым, получал отказ «fetch first» и терял свою
            # запись — тогда следующий запуск слал те же уведомления заново.
            git push "https://x-access-token:${TOKEN}@github.com/aum151-commits/sandow-automation.git" HEAD:main || (
              git pull --rebase "https://x-access-token:${TOKEN}@github.com/aum151-commits/sandow-automation.git" main &&
              git push "https://x-access-token:${TOKEN}@github.com/aum151-commits/sandow-automation.git" HEAD:main
            )
          )
